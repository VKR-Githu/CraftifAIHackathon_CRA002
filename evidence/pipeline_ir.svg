<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="a"/><feMerge><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- background -->
  <rect width="1400" height="900" fill="url(#bg)"/>

  <!-- top bar -->
  <rect width="1400" height="52" fill="#0b1220"/>
  <text x="24" y="34" fill="#e2e8f0" font-size="18" font-weight="700">PipeGen</text>
  <text x="120" y="34" fill="#475569" font-size="14">v0.5.1</text>
  <text x="700" y="34" fill="#e2e8f0" font-size="16" font-weight="600" text-anchor="middle">Pipeline IR — Interactive Node Graph</text>
  <text x="1376" y="34" fill="#94a3b8" font-size="12" text-anchor="end">Click a node to edit its parameters</text>

  <!-- sidebar -->
  <rect x="0" y="52" width="220" height="848" fill="#0b1220"/>
  <rect x="16" y="70" width="188" height="34" rx="6" fill="#14b8a6"/>
  <text x="110" y="92" fill="#052e2b" font-size="13" font-weight="700" text-anchor="middle">+ New Chat</text>
  <text x="16" y="130" fill="#64748b" font-size="11" font-weight="600">RECENTS</text>
  <rect x="12" y="140" width="196" height="30" rx="4" fill="#1e293b"/>
  <text x="22" y="160" fill="#5eead4" font-size="12" font-weight="600">SiteSense hazard zone...</text>
  <text x="22" y="188" fill="#475569" font-size="11">Video detection depth ...</text>
  <text x="22" y="208" fill="#475569" font-size="11">PPE compliance video ...</text>
  <text x="22" y="228" fill="#475569" font-size="11">Factory smoke detection...</text>
  <text x="22" y="248" fill="#475569" font-size="11">Multi-camera object de...</text>
  <text x="22" y="268" fill="#475569" font-size="11">Live video theft detect...</text>
  <text x="22" y="288" fill="#475569" font-size="11">Number plate recogn...</text>
  <text x="22" y="308" fill="#475569" font-size="11">Shoplifting detection vid...</text>

  <circle cx="26" cy="880" r="12" fill="#14b8a6"/>
  <text x="26" y="884" fill="#052e2b" font-size="12" font-weight="700" text-anchor="middle">V</text>
  <text x="46" y="884" fill="#e2e8f0" font-size="12" font-weight="600">vamsi</text>

  <!-- ============ NODES ============ -->
  <!-- INPUT node -->
  <g transform="translate(620, 100)">
    <rect width="220" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="220" height="26" rx="8" fill="#3b82f6"/>
    <text x="12" y="18" fill="#ffffff" font-size="12" font-weight="700">INPUT</text>
    <text x="12" y="46" fill="#cbd5e1" font-size="11" font-family="monospace">filesrc</text>
    <text x="12" y="63" fill="#94a3b8" font-size="10">Decode video file into BGR frames.</text>
  </g>

  <!-- DECODE -->
  <g transform="translate(620, 210)">
    <rect width="220" height="80" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <rect width="220" height="26" rx="8" fill="#22c55e"/>
    <text x="12" y="18" fill="#052e12" font-size="12" font-weight="700">PREPROCESS</text>
    <text x="12" y="46" fill="#cbd5e1" font-size="11" font-family="monospace">nvuridecodebin → nvvidconv</text>
    <text x="12" y="63" fill="#94a3b8" font-size="10">BGR→RGB, resize 640x352, NCHW fp32.</text>
  </g>

  <!-- INFERENCE -->
  <g transform="translate(620, 320)">
    <rect width="220" height="80" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
    <rect width="220" height="26" rx="8" fill="#f97316"/>
    <text x="12" y="18" fill="#431407" font-size="12" font-weight="700">INFERENCE</text>
    <text x="12" y="46" fill="#cbd5e1" font-size="11" font-family="monospace">nvinfer · yolov8n-person</text>
    <text x="12" y="63" fill="#94a3b8" font-size="10">FP16 TensorRT engine · conf 0.55</text>
  </g>

  <!-- POSTPROCESS -->
  <g transform="translate(620, 430)">
    <rect width="220" height="80" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <rect width="220" height="26" rx="8" fill="#a855f7"/>
    <text x="12" y="18" fill="#2e1065" font-size="12" font-weight="700">POSTPROCESS</text>
    <text x="12" y="46" fill="#cbd5e1" font-size="11" font-family="monospace">nvstreambb</text>
    <text x="12" y="63" fill="#94a3b8" font-size="10">Draw person bounding boxes on frames.</text>
  </g>

  <!-- ZONE ANALYZER (typed change) -->
  <g transform="translate(620, 540)">
    <rect width="220" height="80" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="2" filter="url(#glow)"/>
    <rect width="220" height="26" rx="8" fill="#eab308"/>
    <text x="12" y="18" fill="#422006" font-size="12" font-weight="700">ANALYZER · typed change</text>
    <text x="12" y="46" fill="#cbd5e1" font-size="11" font-family="monospace">zone-overlap-analyzer</text>
    <text x="12" y="63" fill="#94a3b8" font-size="10">bbox ∩ HAZARD-A polygon · IoU 0.05</text>
  </g>

  <!-- OUTPUTS (three sinks) -->
  <g transform="translate(280, 680)">
    <rect width="220" height="80" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect width="220" height="26" rx="8" fill="#ef4444"/>
    <text x="12" y="18" fill="#450a0a" font-size="12" font-weight="700">OUTPUT · display</text>
    <text x="12" y="46" fill="#cbd5e1" font-size="11" font-family="monospace">fakesink (role=display)</text>
    <text x="12" y="63" fill="#94a3b8" font-size="10">Annotated live window with red zone.</text>
  </g>

  <g transform="translate(620, 680)">
    <rect width="220" height="80" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect width="220" height="26" rx="8" fill="#ef4444"/>
    <text x="12" y="18" fill="#450a0a" font-size="12" font-weight="700">OUTPUT · JSON</text>
    <text x="12" y="46" fill="#cbd5e1" font-size="11" font-family="monospace">json-metadata-sink</text>
    <text x="12" y="63" fill="#94a3b8" font-size="10">outputs/incidents.json · one line / event</text>
  </g>

  <g transform="translate(960, 680)">
    <rect width="220" height="80" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect width="220" height="26" rx="8" fill="#ef4444"/>
    <text x="12" y="18" fill="#450a0a" font-size="12" font-weight="700">OUTPUT · MQTT</text>
    <text x="12" y="46" fill="#cbd5e1" font-size="11" font-family="monospace">mqtt-sink</text>
    <text x="12" y="63" fill="#94a3b8" font-size="10">safety/site-01/hazard-zone · QoS 1</text>
  </g>

  <!-- ============ EDGES ============ -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="730" y1="180" x2="730" y2="210"/>
    <line x1="730" y1="290" x2="730" y2="320"/>
    <line x1="730" y1="400" x2="730" y2="430"/>
    <line x1="730" y1="510" x2="730" y2="540"/>
    <!-- analyzer to three outputs -->
    <path d="M 730 620 Q 730 650 390 650 Q 390 650 390 680"/>
    <line x1="730" y1="620" x2="730" y2="680"/>
    <path d="M 730 620 Q 730 650 1070 650 Q 1070 650 1070 680"/>
  </g>

  <!-- edge labels -->
  <g fill="#475569" font-size="10" font-family="monospace">
    <text x="740" y="200">uint8</text>
    <text x="740" y="310">fp32 [1,3,352,640]</text>
    <text x="740" y="420">fp32 [1,84,6300]</text>
    <text x="740" y="530">fp32</text>
    <text x="740" y="655">event</text>
  </g>

  <!-- right panel -->
  <rect x="1200" y="60" width="200" height="840" fill="#0b1220"/>
  <text x="1212" y="86" fill="#e2e8f0" font-size="12" font-weight="700">SELECTED: ANALYZER</text>
  <text x="1212" y="108" fill="#94a3b8" font-size="10">id=6</text>
  <text x="1212" y="140" fill="#94a3b8" font-size="10">TYPE</text>
  <text x="1212" y="158" fill="#e2e8f0" font-size="11" font-family="monospace">zone-overlap-analyzer</text>
  <text x="1212" y="182" fill="#94a3b8" font-size="10">ZONES</text>
  <text x="1212" y="200" fill="#e2e8f0" font-size="10" font-family="monospace">HAZARD-A_crane_swing</text>
  <text x="1212" y="216" fill="#94a3b8" font-size="10" font-family="monospace">[[450,300],[900,300],</text>
  <text x="1212" y="230" fill="#94a3b8" font-size="10" font-family="monospace"> [900,650],[450,650]]</text>
  <text x="1212" y="256" fill="#94a3b8" font-size="10">MIN_IOU</text>
  <text x="1212" y="272" fill="#e2e8f0" font-size="11" font-family="monospace">0.05</text>
  <text x="1212" y="296" fill="#94a3b8" font-size="10">MIN_CONF</text>
  <text x="1212" y="312" fill="#e2e8f0" font-size="11" font-family="monospace">0.55</text>
  <rect x="1212" y="336" width="80" height="26" rx="4" fill="#14b8a6"/>
  <text x="1252" y="353" fill="#052e2b" font-size="11" font-weight="700" text-anchor="middle">Apply</text>
  <rect x="1300" y="336" width="80" height="26" rx="4" fill="#1e293b" stroke="#475569"/>
  <text x="1340" y="353" fill="#94a3b8" font-size="11" text-anchor="middle">Revert</text>

  <!-- footer -->
  <text x="700" y="820" fill="#475569" font-size="11" text-anchor="middle">Team Doomsday (2beabae8) · SiteSense · Track A · PipeGen v0.5.1</text>
  <text x="700" y="840" fill="#334155" font-size="10" text-anchor="middle">Pipeline IR — architecture view (venue run scheduled for hackathon day)</text>
</svg>
